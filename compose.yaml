services:
  postgres:
    image: postgres:16-alpine
    container_name: bamboo-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bamboo_meta}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bamboo_meta}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: bamboo-dev-jenkins
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      JENKINS_OPTS: --httpPort=8080

  gitea:
    image: gitea/gitea:1.22.6
    container_name: bamboo-dev-gitea
    restart: unless-stopped
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea_data:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__ROOT_URL: "http://localhost:${GITEA_HTTP_PORT:-3000}/"
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__SSH_PORT: "${GITEA_SSH_PORT:-2222}"
      GITEA__server__START_SSH_SERVER: "false"

volumes:
  postgres_data:
  jenkins_home:
  gitea_data:
