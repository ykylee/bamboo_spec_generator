<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>Projects</title>
  </head>
  <body>
    <h1>프로젝트 목록</h1>
    <ul>
      {% for project in projects %}
      <li>
        <a href="/projects/{{ project.jiraProjectKey }}/">{{ project.jiraProjectKey }}</a>
        (repo {{ project.repositoryCount }}, build {{ project.buildCount }})
      </li>
      {% empty %}
      <li>등록된 프로젝트가 없습니다.</li>
      {% endfor %}
    </ul>
  </body>
</html>
