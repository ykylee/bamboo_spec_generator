[package]
name = "bamboo-backend"
version = "0.1.0"
edition = "2021"
description = "bamboo_spec_generator Rust Backend"

[dependencies]
# Web Framework
actix-web = "4.4"
actix-rt = "2.10"
actix-cors = "0.7"
actix-web-httpauth = "0.8"
actix-multipart = "0.7"

# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "json"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
base64 = "0.22"
similar = "2.6"
futures-util = "0.3"
sha2 = "0.10"
serde_urlencoded = "0.7"
urlencoding = "2.1"

# Environment
dotenv = "0.15"

[dev-dependencies]
tempfile = "3.12"
serial_test = "3.2"

[lib]
name = "bamboo_backend"
path = "src/lib.rs"

[[bin]]
name = "bamboo-backend"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
